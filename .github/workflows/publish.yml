name: Publish Poetry Pop-up Book to MiaoMiao
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本（首次填 1.0.0）；留空使用 package.yml 中的版本'
        type: string
        required: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: poetry-popup-book-publish
  cancel-in-progress: false
jobs:
  publish:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      version: ${{ inputs.version || '' }}
      toolchains: none
      versioned-release-asset: true
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
