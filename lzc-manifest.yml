application:
  subdomain: poetry
  upstreams:
    - location: /
      backend: http://web:80/
  health_check:
    test_url: http://web:80/
    timeout: 5s
    start_period: 10s
services:
  web:
    # 纯静态站点，用官方 nginx 直接托管 LPK 内容目录；站点文件由 CI 构建期从上游固定提交拉取
    image: docker.1ms.run/library/nginx:1.31.8-alpine
    setup_script: |
      # 启动时把站点复制进镜像内的 web 根目录：不依赖 /lzcapp/pkg/content 的权限位
      rm -rf /usr/share/nginx/html/*
      cp -R /lzcapp/pkg/content/web/. /usr/share/nginx/html/
      cat > /etc/nginx/conf.d/default.conf <<'EOF'
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;
          charset utf-8;
          gzip on;
          gzip_types text/css application/javascript application/json image/svg+xml;
          location / {
              try_files $uri $uri/ /index.html;
          }
          location = /index.html {
              add_header Cache-Control "no-cache";
          }
      }
      EOF
    mem_limit: 256m
usage: |
  纸上山河是一本会动、会朗诵的古诗立体书：打开后是一册可翻的立体纸雕书，点选诗篇可以查看注释、听朗诵，支持触摸缩放与自由浏览。
  全部画面、音频与脚本都打包在应用内，离线也能正常使用，不访问任何外部服务。
  建议横屏或平板/桌面浏览器打开，手机上也可以触摸翻页；低端设备首次加载立体模型可能需要几秒。
